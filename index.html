<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action ou Vérité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#F5F5DC;
    --brown:#A0826D;
    --brown-dark:#8a6f5c;
    --avocado:#6B8E23;
    --avocado-dark:#5a7a1d;
    --text:#3A3226;
    --text-light:#6b6152;
    --danger:#b5533a;
    --white:#ffffff;
    --action:#6F4E37;
    --action-dark:#5A3E2B;
    --verite:#C9A66B;
    --verite-dark:#A9834E;
    --joker:#C9A227;
    --joker-dark:#A9880A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins','Inter',-apple-system,sans-serif;
    font-size:16px;
    line-height:1.5;
  }
  #app{
    max-width:800px;
    margin:0 auto;
    padding:20px;
    min-height:100vh;
  }
  h1{font-size:32px;font-weight:700;margin:0 0 20px;}
  h2{font-size:22px;font-weight:600;margin:0 0 16px;}
  p.small, .small{font-size:12px;color:var(--text-light);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:8px;padding:12px 20px;color:#fff;
    font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-nav{background:var(--avocado);}
  .btn-nav:hover:not(:disabled){background:var(--avocado-dark);}
  .btn-action{background:var(--action);}
  .btn-action:hover:not(:disabled){background:var(--action-dark);}
  .btn-verite{background:var(--verite);color:var(--text);}
  .btn-verite:hover:not(:disabled){background:var(--verite-dark);color:#fff;}
  .btn-joker{background:var(--joker);color:var(--text);}
  .btn-joker:hover:not(:disabled){background:var(--joker-dark);color:#fff;}
  .btn-danger{background:var(--danger);}
  .btn-ghost{background:transparent;color:var(--text);border:2px solid var(--avocado);}
  .btn-block{width:100%;}
  .btn-big{padding:18px 22px;font-size:19px;font-weight:600;}
  .icon-btn{
    background:none;border:2px solid var(--avocado);border-radius:50%;
    width:38px;height:38px;font-size:17px;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center;padding:0;flex-shrink:0;
  }
  .icon-btn:hover{background:var(--avocado);color:#fff;}
  .rating-row{display:flex;gap:18px;justify-content:center;margin:-4px 0 18px;}
  .rating-btn{
    background:none;border:2px solid transparent;border-radius:8px;
    font-size:26px;cursor:pointer;padding:4px 12px;opacity:.45;line-height:1;
  }
  .rating-btn:hover{opacity:.8;}
  .rating-btn.active-like{opacity:1;border-color:var(--avocado);}
  .rating-btn.active-dislike{opacity:1;border-color:var(--danger);}
  .joker-popup-modal{position:relative;text-align:center;padding:34px 26px;max-width:320px;}
  .joker-popup-close{
    position:absolute;top:6px;right:6px;width:38px;height:38px;border-radius:50%;
    border:none;background:var(--bg);font-size:18px;cursor:pointer;
  }
  .joker-popup-text{font-size:18px;font-weight:600;margin:10px 0 0;}
  .tab-row{display:flex;gap:8px;margin-bottom:16px;}
  .tab-btn{
    background:none;border:none;border-bottom:3px solid transparent;
    padding:8px 4px;font-family:inherit;font-size:15px;font-weight:600;
    color:var(--text-light);cursor:pointer;
  }
  .tab-btn.active{color:var(--text);border-bottom-color:var(--avocado);}
  .hardness-row .btn{min-width:44px;padding:10px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .card{
    border:2px solid var(--brown);
    background:var(--white);
    border-radius:12px;
    padding:30px;
    min-height:200px;
    margin-bottom:20px;
  }
  input[type=text], select, textarea{
    border:2px solid var(--avocado);
    background:var(--bg);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:16px;
    color:var(--text);
    width:100%;
  }
  textarea{min-height:140px;resize:vertical;font-family:monospace;font-size:13px;}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:6px;
    border:1px solid #e3ddc9;
  }
  .list-item button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:500;margin-bottom:6px;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .dashboard-item{
    display:flex;justify-content:space-between;align-items:center;
    border:2px solid var(--brown);background:var(--white);border-radius:12px;
    padding:16px 20px;margin-bottom:14px;flex-wrap:wrap;gap:10px;
  }
  .dashboard-item .info h3{margin:0 0 4px;font-size:18px;font-weight:600;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media(max-width:768px){.two-col{grid-template-columns:1fr;}}
  .empty-state{
    text-align:center;padding:40px 20px;color:var(--text-light);
    border:2px dashed var(--brown);border-radius:12px;
  }
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--text);color:#fff;padding:12px 20px;border-radius:8px;
    font-size:14px;opacity:0;transition:opacity .3s ease;z-index:999;
    max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(58,50,38,0.5);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:var(--white);border-radius:12px;padding:24px;max-width:520px;width:100%;
    max-height:85vh;overflow-y:auto;border:2px solid var(--brown);
  }
  .flip-scene{perspective:1200px;margin-bottom:20px;}
  .flip-card{
    position:relative;width:100%;min-height:220px;
    transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.4,.2,.2,1);
  }
  .flip-card.flipped{transform:rotateY(180deg);}
  .flip-face{
    position:absolute;inset:0;backface-visibility:hidden;
    border:2px solid var(--brown);background:var(--white);border-radius:12px;
    padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
  }
  .flip-face.back{transform:rotateY(180deg);}
  .player-name{font-size:30px;font-weight:700;color:var(--brown-dark);}
  .question-text{font-size:22px;font-weight:500;line-height:1.5;}
  .category-tag{
    display:inline-block;margin-bottom:14px;font-size:14px;font-weight:700;
    letter-spacing:1px;color:var(--avocado-dark);
  }
  .category-tag.action{color:var(--action);}
  .category-tag.verite{color:var(--verite-dark);}
  .fade{animation:fadeIn .4s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .center{text-align:center;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .qr-box{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:8px;}
  .link-back{background:none;border:none;color:var(--avocado-dark);font-weight:600;cursor:pointer;font-size:14px;padding:0;}
  .dup-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #e3ddc9;}
  .dup-item:last-child{border-bottom:none;}
  .player-input-row{display:flex;gap:8px;margin-bottom:8px;}
  .player-input-row input{flex:1;}
.site-qr{
  position:fixed;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  background:#fff;
  border:2px solid var(--brown, #7a5c46);
  border-radius:14px;
  padding:14px;
  text-align:center;
  z-index:20;
  box-shadow:0 4px 14px rgba(0,0,0,0.15);
}
.site-qr img, .site-qr canvas{ display:block; margin:0 auto; }
.site-qr p{ margin:8px 0 0; font-size:11px; max-width:110px; color:var(--text-light,#666); }
@media (max-width: 1150px){
  .site-qr{ display:none; }
}
.site-share-btn{
  position:fixed;
  left:20px;
  bottom:20px;
  z-index:20;
  padding:10px 16px;
  border-radius:999px;
  border:none;
  background:var(--brown, #7a5c46);
  color:#fff;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,0.2);
}
@media (min-width: 1151px){
  .site-share-btn{ display:none; }
}
@media (max-width: 1150px){
  #app.has-share-pad{ padding-bottom:90px; }
}
  .info-wrap{position:relative;display:inline-flex;margin-left:6px;vertical-align:middle;}
  .info-icon{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:50%;flex-shrink:0;
    background:var(--avocado);color:#fff;font-size:12px;font-weight:700;
    font-style:italic;font-family:Georgia,'Times New Roman',serif;
    cursor:pointer;user-select:none;
  }
  .info-icon:hover{background:var(--avocado-dark);}
  .info-tooltip{
    display:none;position:absolute;left:0;top:24px;z-index:50;
    background:var(--text);color:#fff;padding:12px 14px;border-radius:8px;
    font-size:13px;line-height:1.5;width:250px;box-shadow:0 4px 14px rgba(0,0,0,0.25);
    text-align:left;font-weight:400;
  }
  .info-tooltip b{color:var(--avocado);}
  .info-wrap:hover .info-tooltip{display:block;}
  .info-tooltip.show{display:block;}
  @media(max-width:480px){.info-tooltip{width:190px;left:-90px;}}
  .card.card-action{border-color:var(--action);}
  .card.card-action h2{color:var(--action);}
  .card.card-verite{border-color:var(--verite);}
  .card.card-verite h2{color:var(--verite-dark);}
</style>
</head>
<body>
<div id="site-qr" class="site-qr">
  <div id="site-qr-code"></div>
  <p>Scanne pour retrouver le site</p>
</div>
<button id="site-share-btn" class="site-share-btn" title="Partager le site">Partager le site</button>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ---------- Constantes & stockage ---------- */
const LS_LISTS = 'avv.lists';
const LS_GAME = 'avv.game';
const QR_LIMIT = 2000;

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

function loadLists(){
  let lists;
  try{ lists = JSON.parse(localStorage.getItem(LS_LISTS)) || []; }catch(e){ lists = []; }
  lists.forEach(l=>{
    if(!l.hardness || l.hardness<1 || l.hardness>5) l.hardness = 3;
    ['actions','truths'].forEach(k=>{
      (l[k]||[]).forEach(q=>{
        if(q.rating===undefined) q.rating = null;
        if(q.skipCount===undefined) q.skipCount = 0;
      });
    });
  });
  return lists;
}
function saveLists(lists){ localStorage.setItem(LS_LISTS, JSON.stringify(lists)); }

function loadGame(){
  try{ return JSON.parse(localStorage.getItem(LS_GAME)); }catch(e){ return null; }
}
function saveGame(game){
  if(game) localStorage.setItem(LS_GAME, JSON.stringify(game));
  else localStorage.removeItem(LS_GAME);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function showToast(msg, ms=3000){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove('show'), ms);
}

function catToKey(cat){ return cat==='action' ? 'actions' : 'truths'; }

function getQuestionRating(listId, cat, qid){
  const list = loadLists().find(l=>l.id===listId);
  if(!list) return null;
  const q = list[catToKey(cat)].find(x=>x.id===qid);
  return q ? (q.rating||null) : null;
}

function setQuestionRating(listId, cat, qid, rating){
  const lists = loadLists();
  const list = lists.find(l=>l.id===listId);
  if(!list) return;
  const q = list[catToKey(cat)].find(x=>x.id===qid);
  if(!q) return;
  q.rating = (q.rating===rating) ? null : rating;
  saveLists(lists);
}

function incrementSkipCount(item, cat){
  if(!item) return;
  const lists = loadLists();
  const list = lists.find(l=>l.id===item.listId);
  if(!list) return;
  const q = list[catToKey(cat)].find(x=>x.id===item.qid);
  if(!q) return;
  q.skipCount = (q.skipCount||0) + 1;
  saveLists(lists);
}

/* ---------- État global de l'app (navigation) ---------- */
let App = {
  screen: 'dashboard',   // dashboard | edit | config | game | end
  editingListId: null,   // id de la liste en cours d'édition, ou null = nouvelle
  draft: null,           // brouillon {name, actions:[], truths:[]} pendant l'édition
  configPrefill: null,   // pour "changer les joueurs": {listId, sansRemise}
  mergeModal: null,      // état de la modale de fusion entre listes
  mergeUndo: null,       // sauvegarde avant la dernière fusion (pour pouvoir l'annuler)
  editTab: 'questions',  // onglet actif dans l'écran d'édition : questions | stats
  jokerStatusOpen: false, // modal "jokers restants" ouverte pendant la partie
};

/* ================= RENDU PRINCIPAL ================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const onDashboard = App.screen === 'dashboard';
  const shareBtn = document.getElementById('site-share-btn');
  if(shareBtn) shareBtn.style.display = onDashboard ? '' : 'none';
  app.classList.toggle('has-share-pad', onDashboard);
  if(App.screen === 'dashboard') renderDashboard(app);
  else if(App.screen === 'edit') renderEdit(app);
  else if(App.screen === 'config') renderConfig(app);
  else if(App.screen === 'game') renderGame(app);
  else if(App.screen === 'end') renderEnd(app);
}

function el(tag, opts={}, children=[]){
  const e = document.createElement(tag);
  if(opts.class) e.className = opts.class;
  if(opts.text!==undefined) e.textContent = opts.text;
  if(opts.html!==undefined) e.innerHTML = opts.html;
  if(opts.attrs) for(const k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
  if(opts.on) for(const evt in opts.on) e.addEventListener(evt, opts.on[evt]);
  if(opts.disabled) e.disabled = true;
  if(opts.value!==undefined) e.value = opts.value;
  children.forEach(c=>c && e.appendChild(c));
  return e;
}

/* ================= 1. DASHBOARD ================= */
function renderDashboard(app){
  const lists = loadLists();
  const playableLists = lists.filter(l=>l.actions.length+l.truths.length>0);
  app.appendChild(el('div',{class:'top-bar'},[
    el('h1',{text:'Action ou Vérité'}),
    el('div',{class:'row'},[
      el('button',{class:'btn btn-nav',text:'▶ Jouer',disabled:playableLists.length===0,on:{click:()=>{
        App.configPrefill = null;
        App._configState = null;
        App.dedupModal = null;
        App.screen='config'; render();
      }}}),
      el('button',{class:'btn btn-ghost',text:'+ Créer une nouvelle liste',on:{click:()=>{
        App.editingListId = null;
        App.draft = {name:'', hardness:3, actions:[], truths:[]};
        App.mergeUndo = null;
        App.editingQuestion = null;
        App.editTab = 'questions';
        App.screen='edit'; render();
      }}})
    ])
  ]));

  if(lists.length===0){
    app.appendChild(el('div',{class:'empty-state'},[
      el('p',{text:"Aucune liste pour l'instant. Crée ta première liste de questions pour commencer."})
    ]));
  } else {
    lists.forEach(list=>{
      const item = el('div',{class:'dashboard-item'},[
        el('div',{class:'info'},[
          el('h3',{text:list.name}),
          el('p',{class:'small',text:`${list.actions.length} action(s) · ${list.truths.length} vérité(s) · niveau ${list.hardness||3}/5`})
        ]),
        el('div',{class:'row'},[
          el('button',{class:'btn btn-ghost',text:'Modifier',on:{click:()=>{
            App.editingListId = list.id;
            App.draft = JSON.parse(JSON.stringify(list));
            App.mergeUndo = null;
            App.editingQuestion = null;
            App.editTab = 'questions';
            App.screen='edit'; render();
          }}}),
          el('button',{class:'btn btn-danger',text:'Supprimer',on:{click:()=>{
            if(confirm(`Supprimer la liste "${list.name}" ? Cette action est définitive.`)){
              saveLists(loadLists().filter(l=>l.id!==list.id));
              render();
            }
          }}}),
        ])
      ]);
      app.appendChild(item);
    });
  }
}

/* ================= 2. CREATION / EDITION DE LISTE ================= */
function buildHardnessField(d){
  const wrap = el('div',{class:'field'});
  wrap.appendChild(el('label',{text:'Niveau de difficulté de la liste (1 = soft, 5 = hard)'}));
  const row = el('div',{class:'row hardness-row'});
  for(let n=1;n<=5;n++){
    const active = (d.hardness||3)===n;
    row.appendChild(el('button',{class:'btn '+(active?'btn-nav':'btn-ghost'),text:String(n),on:{click:()=>{ d.hardness=n; render(); }}}));
  }
  wrap.appendChild(row);
  return wrap;
}

function buildStatsView(d){
  const wrap = el('div',{});
  [['actions','Actions'],['truths','Vérités']].forEach(([key,label])=>{
    const card = el('div',{class:'card'+(key==='actions'?' card-action':' card-verite')});
    card.appendChild(el('h2',{text:label}));
    const items = d[key].slice().sort((a,b)=>(b.skipCount||0)-(a.skipCount||0));
    if(items.length===0){
      card.appendChild(el('p',{class:'small',text:'Aucune question dans cette catégorie.'}));
    } else {
      items.forEach(q=>{
        const ratingIcon = q.rating==='like' ? '👍' : (q.rating==='dislike' ? '👎' : '—');
        card.appendChild(el('div',{class:'list-item'},[
          el('span',{text:q.text, attrs:{style:'flex:1;padding-right:10px;'}}),
          el('span',{class:'small', text:`Sautée ${q.skipCount||0}x`, attrs:{style:'margin-right:12px;white-space:nowrap;'}}),
          el('span',{text:ratingIcon})
        ]));
      });
    }
    wrap.appendChild(card);
  });
  return wrap;
}

function renderEdit(app){
  const d = App.draft;
  const isNew = App.editingListId===null;

  app.appendChild(el('button',{class:'link-back',text:'← Retour au dashboard',on:{click:()=>{App.editingQuestion=null;App.screen='dashboard';render();}}}));
  app.appendChild(el('h1',{text:isNew?'Nouvelle liste':'Modifier la liste'}));

  app.appendChild(el('div',{class:'field'},[
    el('label',{text:'Nom de la liste'}),
    el('input',{attrs:{type:'text',placeholder:'Ex : Soirée entre amis'},value:d.name,on:{input:(e)=>{d.name=e.target.value;}}})
  ]));

  app.appendChild(buildHardnessField(d));

  const tabRow = el('div',{class:'tab-row'});
  tabRow.appendChild(el('button',{class:'tab-btn'+(App.editTab==='questions'?' active':''),text:'Questions',on:{click:()=>{App.editTab='questions';render();}}}));
  tabRow.appendChild(el('button',{class:'tab-btn'+(App.editTab==='stats'?' active':''),text:'Statistiques',on:{click:()=>{App.editTab='stats';render();}}}));
  app.appendChild(tabRow);

  if(App.editTab==='stats'){
    app.appendChild(buildStatsView(d));
  } else {
    const twoCol = el('div',{class:'two-col'});
    twoCol.appendChild(buildCategoryEditor('Actions','actions'));
    twoCol.appendChild(buildCategoryEditor('Vérités','truths'));
    app.appendChild(twoCol);

    const toolsRow = el('div',{class:'row',attrs:{style:'margin-top:20px;'}},[
      el('button',{class:'btn btn-ghost',text:'Fusionner une autre liste',on:{click:openMergeModal}}),
      el('button',{class:'btn btn-ghost',text:'Exporter en QR code',on:{click:openQrModal}}),
    ]);
    if(App.mergeUndo){
      toolsRow.appendChild(el('button',{class:'btn btn-ghost',text:'↩ Annuler la dernière fusion',on:{click:()=>{
        d.actions = App.mergeUndo.actions;
        d.truths = App.mergeUndo.truths;
        App.mergeUndo = null;
        showToast('Fusion annulée.');
        render();
      }}}));
    }
    app.appendChild(toolsRow);
  }

  const totalQuestions = d.actions.length + d.truths.length;
  app.appendChild(el('div',{attrs:{style:'margin-top:24px;'}},[
    el('button',{class:'btn btn-nav',text:'Enregistrer',disabled:totalQuestions===0,on:{click:()=>{
      const lists = loadLists();
      if(isNew){
        lists.push({id:uid(), name:d.name.trim()||'Liste sans nom', hardness:d.hardness||3, actions:d.actions, truths:d.truths});
      } else {
        const idx = lists.findIndex(l=>l.id===App.editingListId);
        if(idx>=0) lists[idx] = {id:App.editingListId, name:d.name.trim()||'Liste sans nom', hardness:d.hardness||3, actions:d.actions, truths:d.truths};
      }
      saveLists(lists);
      App.mergeUndo = null;
      App.editingQuestion = null;
      showToast('Liste enregistrée.');
      App.screen='dashboard'; render();
    }}})
  ]));
  if(totalQuestions===0){
    app.appendChild(el('p',{class:'small',attrs:{style:'margin-top:8px;'},text:"Ajoute au moins une question (action ou vérité) pour pouvoir enregistrer."}));
  }

  if(App.mergeModal) renderMergeModal(app);
  if(App.qrModalOpen) renderQrModal(app);

  function buildCategoryEditor(title, key){
    const wrap = el('div',{class:'card'+(key==='actions'?' card-action':' card-verite')});
    wrap.appendChild(el('h2',{text:title}));
    const inputRow = el('div',{class:'row',attrs:{style:'margin-bottom:14px;'}});
    const input = el('input',{attrs:{type:'text',placeholder:`Nouvelle ${title.toLowerCase().slice(0,-1)}...`}});
    input.style.flex='1';
    const addFn = ()=>{
      const val = input.value.trim();
      if(!val) return;
      d[key].push({id:uid(), text:val, rating:null, skipCount:0});
      input.value='';
      render();
    };
    input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addFn(); } });
    inputRow.appendChild(input);
    inputRow.appendChild(el('button',{class:'btn btn-nav',text:'Ajouter',on:{click:addFn}}));
    wrap.appendChild(inputRow);

    const list = el('div',{});
    if(d[key].length===0){
      list.appendChild(el('p',{class:'small',text:'Aucune question dans cette catégorie.'}));
    } else {
      d[key].forEach(q=>{
        const editing = App.editingQuestion && App.editingQuestion.key===key && App.editingQuestion.id===q.id;
        const row = el('div',{class:'list-item'});
        if(editing){
          const editInput = el('input',{attrs:{type:'text'},value:q.text});
          editInput.style.flex='1';
          editInput.style.marginRight='8px';
          const commit = ()=>{
            const val = editInput.value.trim();
            if(val) q.text = val;
            App.editingQuestion = null;
            render();
          };
          editInput.addEventListener('keydown', e=>{
            if(e.key==='Enter'){ e.preventDefault(); commit(); }
            else if(e.key==='Escape'){ App.editingQuestion=null; render(); }
          });
          editInput.addEventListener('blur', commit);
          row.appendChild(editInput);
          row.appendChild(el('button',{text:'✕',on:{click:()=>{
            d[key] = d[key].filter(x=>x.id!==q.id);
            App.editingQuestion = null;
            render();
          }}}));
          list.appendChild(row);
          setTimeout(()=>{ editInput.focus(); editInput.select(); }, 0);
        } else {
          const span = el('span',{text:q.text,attrs:{style:'cursor:pointer;flex:1;'}});
          span.title = 'Cliquer pour modifier';
          span.addEventListener('click', ()=>{
            App.editingQuestion = {key, id:q.id};
            render();
          });
          row.appendChild(span);
          row.appendChild(el('button',{text:'✕',on:{click:()=>{
            d[key] = d[key].filter(x=>x.id!==q.id);
            render();
          }}}));
          list.appendChild(row);
        }
      });
    }
    wrap.appendChild(list);
    return wrap;
  }
}

/* ----- Fusion / import JSON ----- */
function parseImportedJSON(raw){
  let obj;
  try{ obj = JSON.parse(raw); }catch(e){ return {error:'Le JSON est invalide (erreur de syntaxe).'}; }
  if(typeof obj !== 'object' || obj===null) return {error:'Format inattendu : un objet JSON est requis.'};
  const norm = (arr)=>{
    if(arr===undefined) return [];
    if(!Array.isArray(arr)) return null;
    const out = [];
    for(const item of arr){
      if(typeof item === 'string') out.push(item.trim());
      else if(item && typeof item.text === 'string') out.push(item.text.trim());
      else return null;
    }
    return out.filter(Boolean);
  };
  const actions = norm(obj.actions);
  const truths = norm(obj.truths);
  if(actions===null || truths===null) return {error:"Structure invalide : 'actions' et 'truths' doivent être des listes de textes."};
  if(actions.length===0 && truths.length===0) return {error:'Le JSON ne contient aucune question.'};
  return {name: typeof obj.name==='string'?obj.name:null, actions, truths};
}

function renderMergeModal(app){

    modal.appendChild(el('p',{class:'small',text:"Ajoute toutes les questions d'une autre liste a celle-ci. La liste d'origine n'est ni modifiee ni supprimee."}));

      modal.appendChild(select);
      modal.appendChild(el('div',{class:'row',attrs:{style:'margin-top:16px;'}},[
        el('button',{class:'btn btn-nav',text:'Suivant',on:{click:()=>{
          const source = others.find(l=>l.id===state.sourceListId);
          if(!source) return;
          prepareDuplicateReview(source);
        }}}),
        el('button',{class:'btn btn-ghost',text:'Annuler',on:{click:()=>{App.mergeModal=null;render();}}}),
      ]));
    }
  } else if(state.step==='review'){
    modal.appendChild(el('h2',{text:`Fusionner "${state.sourceName}"`}));
    modal.appendChild(el('p',{class:'small',text:'Les questions identiques (texte strictement identique) deja presentes dans cette liste sont cochees pour exclusion. Decoche celles que tu veux quand meme ajouter en double.'}));
    if(state.duplicates.length===0){
      modal.appendChild(el('p',{text:'Aucun doublon detecte.'}));
    } else {
      modal.appendChild(el('div',{class:'row',attrs:{style:'margin-bottom:8px;'}},[
        el('button',{class:'btn btn-ghost',text:'Tout exclure',on:{click:()=>{state.duplicates.forEach(x=>x.exclude=true); render();}}}),
        el('button',{class:'btn btn-ghost',text:'Tout inclure',on:{click:()=>{state.duplicates.forEach(x=>x.exclude=false); render();}}}),
      ]));
      state.duplicates.forEach(dup=>{
        const row = el('div',{class:'dup-item'});
        const cb = el('input',{attrs:{type:'checkbox'}});
        cb.checked = dup.exclude;
        cb.addEventListener('change', e=>{ dup.exclude = e.target.checked; });
        row.appendChild(cb);
        row.appendChild(el('span',{text:`[${dup.category==='actions'?'Action':'Verite'}] ${dup.text}`}));
        modal.appendChild(row);
      });
    }
    modal.appendChild(el('div',{class:'row',attrs:{style:'margin-top:16px;'}},[
      el('button',{class:'btn btn-nav',text:'Fusionner',on:{click:()=>{
        applyMerge(state);
        App.mergeModal=null;
        showToast('Fusion effectuee.');
        render();
      }}}),
      el('button',{class:'btn btn-ghost',text:'\u2190 Retour',on:{click:()=>{
        state.step='select';
        render();
      }}}),
      el('button',{class:'btn btn-ghost',text:'Annuler',on:{click:()=>{App.mergeModal=null;render();}}}),
    ]));
  }

  overlay.appendChild(modal);
  app.appendChild(overlay);

  function prepareDuplicateReview(source){
    const incoming = {actions: source.actions.map(a=>a.text), truths: source.truths.map(t=>t.text)};
    const existingActions = new Set(App.draft.actions.map(a=>a.text));
    const existingTruths = new Set(App.draft.truths.map(t=>t.text));
    const duplicates = [];
    incoming.actions.forEach(t=>{ if(existingActions.has(t)) duplicates.push({category:'actions', text:t, exclude:true}); });
    incoming.truths.forEach(t=>{ if(existingTruths.has(t)) duplicates.push({category:'truths', text:t, exclude:true}); });
    state.step='review';
    state.sourceName = source.name;
    state.incoming = incoming;
    state.duplicates = duplicates;
    render();
  }
}

function applyMerge(state){
  App.mergeUndo = { actions: App.draft.actions.slice(), truths: App.draft.truths.slice() };
  const excludedTexts = {actions:new Set(), truths:new Set()};
  state.duplicates.forEach(d=>{ if(d.exclude) excludedTexts[d.category].add(d.text); });
  state.incoming.actions.forEach(t=>{ if(!excludedTexts.actions.has(t)) App.draft.actions.push({id:uid(), text:t, rating:null, skipCount:0}); });
  state.incoming.truths.forEach(t=>{ if(!excludedTexts.truths.has(t)) App.draft.truths.push({id:uid(), text:t, rating:null, skipCount:0}); });
}

/* ----- Import automatique via ?data= ----- */
function tryAutoImportFromURL(){
  const params = new URLSearchParams(location.search);
  const data = params.get('data');
  if(!data) return;
  try{
    const json = LZString.decompressFromEncodedURIComponent(data);
    const res = parseImportedJSON(json);
    if(res.error){ showToast('Import via QR échoué : ' + res.error); return; }
    const lists = loadLists();
    const name = res.name || 'Liste importée';
    const existing = lists.find(l=>l.name===name);
    if(existing){
      const existingActions = new Set(existing.actions.map(a=>a.text));
      const existingTruths = new Set(existing.truths.map(t=>t.text));
      const newActions = res.actions.filter(t=>!existingActions.has(t)).map(t=>({id:uid(),text:t,rating:null,skipCount:0}));
      const newTruths = res.truths.filter(t=>!existingTruths.has(t)).map(t=>({id:uid(),text:t,rating:null,skipCount:0}));
      existing.actions.push(...newActions);
      existing.truths.push(...newTruths);
      saveLists(lists);
      showToast(`Liste "${name}" fusionnée depuis le QR code (doublons ignorés).`);
    } else {
      lists.push({id:uid(), name, hardness:3, actions:res.actions.map(t=>({id:uid(),text:t,rating:null,skipCount:0})), truths:res.truths.map(t=>({id:uid(),text:t,rating:null,skipCount:0}))});
      saveLists(lists);
      showToast(`Liste "${name}" importée depuis le QR code.`);
    }
  }catch(e){
    showToast('Import via QR échoué : données illisibles.');
  }
  history.replaceState(null,'',location.pathname);
}

/* ================= 3. CONFIGURATION DE PARTIE ================= */
function buildCombinedPools(selectedLists){
  const result = {actions:[], truths:[], duplicates:[]};
  ['actions','truths'].forEach(cat=>{
    const seen = new Set();
    selectedLists.forEach(list=>{
      list[cat].forEach(q=>{
        const isDup = seen.has(q.text);
        const item = {text:q.text, listId:list.id, qid:q.id, hardness:list.hardness||3, exclude:isDup};
        result[cat].push(item);
        if(isDup) result.duplicates.push({category:cat, text:q.text, ref:item});
        else seen.add(q.text);
      });
    });
  });
  return result;
}

function finalizeLaunch(combined, names, selectedLists, sansRemise, jokersMax, order, progressif){
  const mkItem = x => ({uid:`${x.listId}:${x.qid}`, listId:x.listId, qid:x.qid, text:x.text, hardness:x.hardness});
  const actionsFinal = combined.actions.filter(x=>!x.exclude).map(mkItem);
  const truthsFinal = combined.truths.filter(x=>!x.exclude).map(mkItem);
  const game = {
    listIds: selectedLists.map(l=>l.id),
    listNames: selectedLists.map(l=>l.name).join(' + '),
    players: names,
    sansRemise: sansRemise,
    jokersMax: jokersMax||0,
    jokersUsed: names.map(()=>0),
    seen: { action: names.map(()=>[]), verite: names.map(()=>[]) },
    actionsTotal: actionsFinal.length,
    truthsTotal: truthsFinal.length,
    actionsPoolFull: actionsFinal.slice(),
    truthsPoolFull: truthsFinal.slice(),
    actionsPool: actionsFinal.slice(),
    truthsPool: truthsFinal.slice(),
    order: order==='chain' ? 'chain' : 'random',
    progressif: !!(progressif && sansRemise),
    queue: [],
    currentPlayerIndex: 0,
    phase: 'choosing',
    currentCategory: null,
    currentQuestionText: null,
    currentItem: null,
    jokerPopup: null,
    justExhausted: null,
    exhaustedCategory: null,
    otherHasStock: false
  };
  if(game.order==='chain'){
    game.currentPlayerIndex = Math.floor(Math.random()*names.length);
  } else {
    game.queue = shuffle(names.map((_,i)=>i));
    game.currentPlayerIndex = game.queue.shift();
  }
  saveGame(game);
  App._configState = null;
  App.configPrefill = null;
  App.dedupModal = null;
  App.screen='game';
  render();
}

  card3.appendChild(orderChainRow);
  app.appendChild(card3);

  const launchBtn = el('button',{class:'btn btn-nav btn-block',text:'Lancer la partie',attrs:{id:'launch-btn'},on:{click:launchGame}});
  app.appendChild(launchBtn);

  if(App.dedupModal) renderDedupModal(app);

  function syncLaunchButton(){
    const validPlayers = cs.players.filter(p=>p.trim().length>0).length;
    const btn = document.getElementById('launch-btn');
    if(btn) btn.disabled = !(validPlayers>=2 && cs.listIds.length>0);
  }
  syncLaunchButton();

  function launchGame(){
    const names = cs.players.map(p=>p.trim()).filter(Boolean);
    if(names.length<2 || cs.listIds.length===0) return;
    const allLists = loadLists();
    const selectedLists = cs.listIds.map(id=>allLists.find(l=>l.id===id)).filter(Boolean);
    if(selectedLists.length===0) return;
    const combined = buildCombinedPools(selectedLists);
    if(selectedLists.length>1 && combined.duplicates.length>0){
      App.dedupModal = {combined, names, selectedLists, sansRemise:cs.sansRemise, jokersMax:cs.jokersMax, order:cs.order, progressif:cs.progressif};
      render();
      return;
    }
    finalizeLaunch(combined, names, selectedLists, cs.sansRemise, cs.jokersMax, cs.order, cs.progressif);
  }
}

/* ================= 4. ECRAN DE JEU ================= */
function categoryAvailable(game, cat, playerIndex){
  if(game.sansRemise){
    const pool = cat==='action' ? game.actionsPool : game.truthsPool;
    return pool.length>0;
  }
  // avec remise : une question déjà vue par CE joueur ne doit pas lui retomber dessus,
  // mais reste disponible pour les autres joueurs.
  const poolFull = cat==='action' ? game.actionsPoolFull : game.truthsPoolFull;
  const seenArr = (game.seen && game.seen[cat] && game.seen[cat][playerIndex]) || [];
  const seenSet = new Set(seenArr);
  return poolFull.some(it=>!seenSet.has(it.uid));
}

function gameProgress(g){
  const totalStart = (g.actionsTotal||0)+(g.truthsTotal||0);
  if(totalStart<=0) return 0;
  const remaining = (g.actionsPool?g.actionsPool.length:0)+(g.truthsPool?g.truthsPool.length:0);
  const drawn = totalStart - remaining;
  return Math.max(0, Math.min(1, drawn/totalStart));
}

function weightedPick(pool, target){
  const weights = pool.map(it=>1/(1+Math.abs((it.hardness||3)-target)));
  const total = weights.reduce((a,b)=>a+b,0);
  if(total<=0) return Math.floor(Math.random()*pool.length);
  let r = Math.random()*total;
  for(let i=0;i<pool.length;i++){
    r -= weights[i];
    if(r<=0) return i;
  }
  return pool.length-1;
}

function advanceTurn(g){
  if(g.order==='chain'){
    g.phase='designating';
    g.currentCategory=null;
    g.currentQuestionText=null;
    g.currentItem=null;
    return;
  }
  if(g.queue.length===0) g.queue = shuffle(g.players.map((_,i)=>i));
  g.currentPlayerIndex = g.queue.shift();
  g.phase='choosing';
  g.currentCategory=null;
  g.currentQuestionText=null;
  g.currentItem=null;
}

function renderGame(app){
  let game = loadGame();
  if(!game){ App.screen='dashboard'; render(); return; }
  const listName = game.listNames || (function(){
    const list = loadLists().find(l=>l.id===game.listId);
    return list ? list.name : 'Liste';
  })();

  const topBarRight = el('div',{class:'row',attrs:{style:'align-items:center;'}});
  if(game.jokersMax>0){
    topBarRight.appendChild(el('button',{class:'icon-btn',text:'👁',attrs:{title:'Voir les jokers restants'},on:{click:()=>{ App.jokerStatusOpen = true; render(); }}}));
  }
  topBarRight.appendChild(el('button',{class:'link-back',text:'Abandonner la partie',on:{click:()=>{
    if(confirm('Abandonner la partie en cours et revenir au dashboard ?')){
      saveGame(null); App.jokerStatusOpen=false; App.screen='dashboard'; render();
    }
  }}}));
  app.appendChild(el('div',{class:'top-bar'},[
    el('span',{class:'small',text:listName}),
    topBarRight
  ]));

  if(game.phase==='exhausted'){
    renderExhaustedScreen(app, game);
    return;
  }
  if(game.phase==='finished'){
    App.screen='end'; render(); return;
  }
  if(game.phase==='designating'){
    renderDesignating(app, game);
    if(App.jokerStatusOpen) renderJokerStatusModal(app, game);
    return;
  }

  const playerName = game.players[game.currentPlayerIndex];
  const catClass = game.currentCategory==='action' ? 'action' : 'verite';
  const scene = el('div',{class:'flip-scene'});
  const flipCard = el('div',{class:'flip-card'+(game.phase==='revealed'?' flipped':'')});

  const front = el('div',{class:'flip-face front'},[
    el('div',{class:'player-name',text:playerName})
  ]);
  const back = el('div',{class:'flip-face back'},[
    el('div',{class:'category-tag '+catClass,text: game.currentCategory==='action'?'ACTION':'VÉRITÉ'}),
    el('div',{class:'question-text',text: game.currentQuestionText ?
      `${playerName} : ${game.currentQuestionText}` : ''})
  ]);
  flipCard.appendChild(front);
  flipCard.appendChild(back);
  scene.appendChild(flipCard);
  app.appendChild(scene);

  if(game.phase==='choosing'){
    const canAction = categoryAvailable(game,'action', game.currentPlayerIndex);
    const canVerite = categoryAvailable(game,'verite', game.currentPlayerIndex);
    if(!canAction && !canVerite){
      app.appendChild(el('div',{class:'card center'},[
        el('p',{text:`${playerName} a déjà eu toutes les questions disponibles dans cette liste.`})
      ]));
      app.appendChild(el('button',{class:'btn btn-nav btn-block',text:'Joueur suivant',on:{click:()=>{
        const g = loadGame();
        advanceTurn(g);
        saveGame(g);
        render();
      }}}));
    } else {
      const row = el('div',{class:'row'});
      if(canAction) row.appendChild(el('button',{class:'btn btn-action btn-block btn-big',text:'Action',on:{click:()=>drawQuestion('action')}}));
      if(canVerite) row.appendChild(el('button',{class:'btn btn-verite btn-block btn-big',text:'Vérité',on:{click:()=>drawQuestion('verite')}}));
      app.appendChild(row);
    }
  } else if(game.phase==='revealed'){
    if(game.currentItem){
      const curRating = getQuestionRating(game.currentItem.listId, game.currentCategory, game.currentItem.qid);
      const ratingRow = el('div',{class:'rating-row'});
      ratingRow.appendChild(el('button',{class:'rating-btn'+(curRating==='like'?' active-like':''),text:'👍',attrs:{title:'Question intéressante'},on:{click:()=>toggleRating('like')}}));
      ratingRow.appendChild(el('button',{class:'rating-btn'+(curRating==='dislike'?' active-dislike':''),text:'👎',attrs:{title:'Question pas intéressante'},on:{click:()=>toggleRating('dislike')}}));
      app.appendChild(ratingRow);
    }
    const nextLabel = game.currentCategory==='action' ? 'Fait' : 'Répondu';
    const nextBtnClass = game.currentCategory==='action' ? 'btn-action' : 'btn-verite';
    const row = el('div',{class:'row'});
    row.appendChild(el('button',{class:'btn '+nextBtnClass+' btn-big',attrs:{style:'flex:1;'},text:nextLabel,on:{click:goNext}}));
    if(game.jokersMax>0){
      const used = (game.jokersUsed && game.jokersUsed[game.currentPlayerIndex]) || 0;
      const remaining = game.jokersMax - used;
      const canJoker = remaining>0 && categoryAvailable(game, game.currentCategory, game.currentPlayerIndex);
      row.appendChild(el('button',{class:'btn btn-joker btn-big',attrs:{style:'flex:1;'},text:`🃏 Joker (${remaining})`,disabled:!canJoker,on:{click:useJoker}}));
    }
    app.appendChild(row);
  }

  if(App.jokerStatusOpen) renderJokerStatusModal(app, game);
  if(game.jokerPopup) renderJokerPopup(app, game);

  function toggleRating(rating){
    const g = loadGame();
    if(!g.currentItem) return;
    setQuestionRating(g.currentItem.listId, g.currentCategory, g.currentItem.qid, rating);
    render();
  }

  function performDraw(g, cat, playerIndex){
    let item;
    if(g.sansRemise){
      const pool = cat==='action' ? g.actionsPool : g.truthsPool;
      let idx;
      if(g.progressif){
        const target = 1 + gameProgress(g)*4;
        idx = weightedPick(pool, target);
      } else {
        idx = Math.floor(Math.random()*pool.length);
      }
      item = pool[idx];
      pool.splice(idx,1);
    } else {
      const poolFull = cat==='action' ? g.actionsPoolFull : g.truthsPoolFull;
      if(!g.seen) g.seen = {action:g.players.map(()=>[]), verite:g.players.map(()=>[])};
      const seenArr = g.seen[cat][playerIndex] || [];
      const seenSet = new Set(seenArr);
      const available = poolFull.filter(it=>!seenSet.has(it.uid));
      const idx = Math.floor(Math.random()*available.length);
      item = available[idx];
      if(!g.seen[cat][playerIndex]) g.seen[cat][playerIndex] = [];
      g.seen[cat][playerIndex].push(item.uid);
    }
    g.currentCategory = cat;
    g.currentQuestionText = item.text;
    g.currentItem = item;
    g.phase = 'revealed';
    if(g.sansRemise){
      const nowPool = cat==='action' ? g.actionsPool : g.truthsPool;
      g.justExhausted = nowPool.length===0 ? cat : null;
    } else {
      g.justExhausted = null;
    }
  }

  function drawQuestion(cat){
    const g = loadGame();
    performDraw(g, cat, g.currentPlayerIndex);
    saveGame(g);
    render();
  }

  function useJoker(){
    const g = loadGame();
    if(!(g.jokersMax>0)) return;
    if(!g.jokersUsed) g.jokersUsed = g.players.map(()=>0);
    const used = g.jokersUsed[g.currentPlayerIndex] || 0;
    if(used>=g.jokersMax) return;
    const cat = g.currentCategory;
    if(!categoryAvailable(g, cat, g.currentPlayerIndex)) return;
    incrementSkipCount(g.currentItem, cat);
    g.jokersUsed[g.currentPlayerIndex] = used + 1;
    performDraw(g, cat, g.currentPlayerIndex);
    const remaining = g.jokersMax - g.jokersUsed[g.currentPlayerIndex];
    g.jokerPopup = {name: g.players[g.currentPlayerIndex], remaining};
    saveGame(g);
    render();
  }

  function goNext(){
    const g = loadGame();
    if(g.justExhausted){
      const other = g.justExhausted==='action' ? 'verite' : 'action';
      g.exhaustedCategory = g.justExhausted;
      g.otherHasStock = categoryAvailable(g, other, g.currentPlayerIndex);
      g.justExhausted = null;
      g.phase = 'exhausted';
      saveGame(g);
      render();
      return;
    }
    advanceTurn(g);
    saveGame(g);
    render();
  }
}

function renderDesignating(app, game){
  const prevName = game.players[game.currentPlayerIndex];
  app.appendChild(el('div',{class:'card center'},[
    el('h2',{text:`${prevName}, qui joue ensuite ?`})
  ]));
  const stack = el('div',{class:'stack'});
  game.players.forEach((name,i)=>{
    if(i===game.currentPlayerIndex) return;
    stack.appendChild(el('button',{class:'btn btn-nav btn-block',text:name,on:{click:()=>{
      const g = loadGame();
      g.currentPlayerIndex = i;
      g.phase='choosing';
      g.currentCategory=null; g.currentQuestionText=null; g.currentItem=null;
      saveGame(g); render();
    }}}));
  });
  app.appendChild(stack);
}

function renderJokerStatusModal(app, game){
  const overlay = el('div',{class:'modal-overlay',on:{click:(e)=>{ if(e.target===overlay){ App.jokerStatusOpen=false; render(); } }}});
  const modal = el('div',{class:'modal'});
  modal.appendChild(el('h2',{text:'Jokers restants'}));
  game.players.forEach((name,i)=>{
    const used = (game.jokersUsed && game.jokersUsed[i]) || 0;
    const remaining = game.jokersMax - used;
    modal.appendChild(el('p',{text:`${name} : ${remaining} joker${remaining>1?'s':''} restant${remaining>1?'s':''}`}));
  });
  modal.appendChild(el('div',{attrs:{style:'margin-top:12px;'}},[
    el('button',{class:'btn btn-nav',text:'Fermer',on:{click:()=>{App.jokerStatusOpen=false;render();}}})
  ]));
  overlay.appendChild(modal);
  app.appendChild(overlay);
}

function renderJokerPopup(app, game){
  const p = game.jokerPopup;
  const overlay = el('div',{class:'modal-overlay',on:{click:closeJokerPopup}});
  const modal = el('div',{class:'modal joker-popup-modal',on:{click:(e)=>{ e.stopPropagation(); }}});
  modal.appendChild(el('button',{class:'joker-popup-close',text:'✕',on:{click:closeJokerPopup}}));
  modal.appendChild(el('div',{class:'joker-popup-text',text:`${p.name}, il te reste ${p.remaining} joker${p.remaining>1?'s':''} !`}));
  overlay.appendChild(modal);
  app.appendChild(overlay);
}

function closeJokerPopup(){
  const g = loadGame();
  if(g){ g.jokerPopup = null; saveGame(g); }
  render();
}

function renderExhaustedScreen(app, game){
  const catLabel = game.exhaustedCategory==='action' ? 'Actions' : 'Vérités';
  app.appendChild(el('div',{class:'card center'},[
    el('h2',{text:`Catégorie "${catLabel}" épuisée`}),
    el('p',{text:'Toutes les questions de cette catégorie ont été utilisées pour cette partie.'})
  ]));
  const row = el('div',{class:'stack'});
  if(game.otherHasStock){
    row.appendChild(el('button',{class:'btn btn-nav btn-block',text:"Continuer avec l'autre catégorie",on:{click:()=>{
      const g = loadGame();
      advanceTurn(g);
      saveGame(g); render();
    }}}));
  }
  row.appendChild(el('button',{class:'btn btn-danger btn-block',text:'Terminer la partie',on:{click:()=>{
    const g = loadGame();
    g.phase='finished';
    saveGame(g);
    App.screen='end'; render();
  }}}));
  app.appendChild(row);
}

/* ================= 5. FIN DE PARTIE ================= */
function renderEnd(app){
  const game = loadGame();
  app.appendChild(el('div',{class:'card center'},[
    el('h1',{text:'Partie terminée'}),
    el('p',{text:'Bien joué à tous les participants !'})
  ]));
  const stack = el('div',{class:'stack'});
  stack.appendChild(el('button',{class:'btn btn-nav btn-block',text:'Recommencer',on:{click:()=>{
    if(!game) { App.screen='dashboard'; render(); return; }
    const actionsFull = game.actionsPoolFull || game.actionsPool.slice();
    const truthsFull = game.truthsPoolFull || game.truthsPool.slice();
    const newGame = {
      listIds: game.listIds || (game.listId ? [game.listId] : []),
      listNames: game.listNames || '',
      players: game.players.slice(),
      sansRemise: game.sansRemise,
      jokersMax: game.jokersMax || 0,
      jokersUsed: game.players.map(()=>0),
      seen: { action: game.players.map(()=>[]), verite: game.players.map(()=>[]) },
      actionsTotal: actionsFull.length,
      truthsTotal: truthsFull.length,
      actionsPoolFull: actionsFull.slice(),
      truthsPoolFull: truthsFull.slice(),
      actionsPool: actionsFull.slice(),
      truthsPool: truthsFull.slice(),
      order: game.order==='chain' ? 'chain' : 'random',
      progressif: !!game.progressif,
      queue: [],
      currentPlayerIndex: 0,
      phase:'choosing',
      currentCategory:null, currentQuestionText:null, currentItem:null, jokerPopup:null,
      justExhausted:null, exhaustedCategory:null, otherHasStock:false
    };
    if(newGame.order==='chain'){
      newGame.currentPlayerIndex = Math.floor(Math.random()*newGame.players.length);
    } else {
      newGame.queue = shuffle(newGame.players.map((_,i)=>i));
      newGame.currentPlayerIndex = newGame.queue.shift();
    }
    saveGame(newGame);
    App.screen='game'; render();
  }}}));
  stack.appendChild(el('button',{class:'btn btn-ghost btn-block',text:'Changer les joueurs',on:{click:()=>{
    if(!game){ App.screen='dashboard'; render(); return; }
    App.configPrefill = {
      listIds: game.listIds || (game.listId ? [game.listId] : []),
      sansRemise: game.sansRemise,
      jokersMax: game.jokersMax || 0,
      order: game.order==='chain' ? 'chain' : 'random',
      progressif: !!game.progressif,
      players:[]
    };
    App._configState = null;
    saveGame(null);
    App.screen='config'; render();
  }}}));
  stack.appendChild(el('button',{class:'btn btn-danger btn-block',text:'Terminer',on:{click:()=>{
    saveGame(null);
    App.jokerStatusOpen=false;
    App.screen='dashboard'; render();
  }}}));
  app.appendChild(stack);
}

/* ================= INITIALISATION ================= */
/* ----- QR code du site + bouton de partage ----- */
const SITE_URL = 'https://arthur-soulard.github.io/actionverite.github.io/';

function renderSiteQr(){
  const box = document.getElementById('site-qr-code');
  if(!box) return;
  try{ new QRCode(box, {text:SITE_URL, width:110, height:110}); }
  catch(e){ /* ignore si la lib n'a pas pu charger */ }
}

function shareSite(){
  if(navigator.share){
    navigator.share({title:'Action ou Vérité', url:SITE_URL}).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(SITE_URL)
      .then(()=>showToast('Lien copié dans le presse-papiers !'))
      .catch(()=>showToast(SITE_URL));
  } else {
    showToast(SITE_URL);
  }
}

renderSiteQr();
const shareBtn = document.getElementById('site-share-btn');
if(shareBtn) shareBtn.addEventListener('click', shareSite);

document.addEventListener('click', function(e){
  document.querySelectorAll('.info-tooltip.show').forEach(t=>{
    if(!t.parentElement.contains(e.target)) t.classList.remove('show');
  });
});

tryAutoImportFromURL();
const existingGame = loadGame();
if(existingGame && existingGame.phase !== 'finished'){
  App.screen = 'game';
} else if(existingGame && existingGame.phase === 'finished'){
  App.screen = 'end';
}
render();
